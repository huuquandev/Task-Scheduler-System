version: '3.9'

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: task_scheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_scheduler"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # Production: dùng image mà pipeline CD vừa push lên GHCR
    # (job deploy trên server chạy `docker compose pull` để kéo bản mới nhất)
    image: ghcr.io/huuquandev/task-scheduler-api:latest
    # Local dev: chạy `docker compose build` sẽ build từ source và tag thành
    # đúng tên image trên, nên dev local vẫn chạy offline được.
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=task_scheduler;Username=postgres;Password=${DB_PASSWORD}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=TaskSchedulerAPI
      - Jwt__Audience=TaskSchedulerClient
      - Smtp__Host=${SMTP_HOST}
      - Smtp__Port=${SMTP_PORT}
      - Smtp__User=${SMTP_USER}
      - Smtp__Password=${SMTP_PASSWORD}
      - Notifications__AdminEmail=${NOTIFICATIONS_ADMIN_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
