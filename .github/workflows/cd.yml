name: CD

on:
  push:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    needs: []

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/task-scheduler-api:latest
            ghcr.io/${{ github.repository_owner }}/task-scheduler-api:${{ github.sha }}

  deploy:
    # Chỉ chạy sau khi job docker push image thành công.
    # Nếu chưa cấu hình secrets DEPLOY_* thì job tự SKIP (không làm hỏng pipeline).
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy configuration
        id: check
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::DEPLOY_HOST chưa được cấu hình - bỏ qua auto-deploy. Image vẫn đã push lên GHCR."
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            # Chỉ cần đăng nhập GHCR nếu repo là private
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.DEPLOY_GHCR_USER }}" --password-stdin
            fi
            docker compose pull
            docker compose up -d
            docker image prune -f
