name: CD

on:
  push:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    needs: []

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/task-scheduler-api:latest
            ghcr.io/${{ github.repository_owner }}/task-scheduler-api:${{ github.sha }}

  deploy:
    # Chạy trên self-hosted runner (máy local Windows).
    # Đăng ký runner tại: GitHub repo → Settings → Actions → Runners → New self-hosted runner
    runs-on: self-hosted
    needs: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull image từ GHCR
        run: docker pull ghcr.io/${{ github.repository_owner }}/task-scheduler-api:latest

      - name: Restart containers
        working-directory: ${{ github.workspace }}
        run: |
          docker compose up -d --no-build
          docker image prune -f
