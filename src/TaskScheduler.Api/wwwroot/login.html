<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Task Scheduler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>

<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <div class="logo-icon">⚡</div>
      <h1>Task Scheduler</h1>
      <p>Manage and automate your scheduled tasks</p>
    </div>

    <!-- Tabs -->
    <div class="login-tabs">
      <div class="login-tab active" id="tab-login" onclick="switchTab('login')">Sign In</div>
      <div class="login-tab" id="tab-register" onclick="switchTab('register')">Register</div>
    </div>

    <!-- Error -->
    <div class="login-error" id="error-msg"></div>

    <!-- Login Form -->
    <form id="form-login">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-control" id="login-username" type="text" placeholder="Enter username" required />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" id="login-password" type="password" placeholder="Enter password" required />
      </div>
      <button type="submit" class="login-submit" id="login-btn">Sign In</button>
    </form>

    <!-- Register Form -->
    <form id="form-register" style="display:none">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-control" id="reg-username" type="text" placeholder="Choose a username" required />
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-control" id="reg-email" type="email" placeholder="your@email.com" required />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" id="reg-password" type="password" placeholder="Min. 8 characters" required />
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input class="form-control" id="reg-confirm" type="password" placeholder="Repeat password" required />
      </div>
      <button type="submit" class="login-submit" id="reg-btn">Create Account</button>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  // Redirect nếu đã login
  if (getToken()) window.location.href = '/index.html';

  function switchTab(tab) {
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('form-login').style.display = tab === 'login' ? '' : 'none';
    document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
    hideError();
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.classList.add('show');
  }

  function hideError() {
    document.getElementById('error-msg').classList.remove('show');
  }

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.innerHTML = loading
      ? `<span class="spinner" style="width:16px;height:16px;border-width:2px;vertical-align:middle;margin-right:6px"></span>Loading...`
      : btn.dataset.label;
  }

  document.getElementById('login-btn').dataset.label = 'Sign In';
  document.getElementById('reg-btn').dataset.label = 'Create Account';

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    setLoading('login-btn', true);
    try {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const res = await Auth.login(username, password);
      localStorage.setItem('token', res.data.token);
      localStorage.setItem('username', username);
      window.location.href = '/index.html';
    } catch (err) {
      showError(err.message || 'Invalid username or password.');
    } finally {
      setLoading('login-btn', false);
    }
  });

  document.getElementById('form-register').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    const password = document.getElementById('reg-password').value;
    const confirm = document.getElementById('reg-confirm').value;
    if (password !== confirm) { showError('Passwords do not match.'); return; }
    setLoading('reg-btn', true);
    try {
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      await Auth.register(username, email, password, confirm);
      toast('Account created! Please sign in.', 'success');
      switchTab('login');
      document.getElementById('login-username').value = username;
    } catch (err) {
      showError(err.message || 'Registration failed.');
    } finally {
      setLoading('reg-btn', false);
    }
  });
</script>
</body>
</html>
